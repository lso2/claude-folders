<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude - Folders</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-text">Claude</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="https://claude.ai/new" target="_blank" class="nav-item new-chat-btn">
                    <div class="new-chat-icon-wrapper">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 3C10.4142 3 10.75 3.33579 10.75 3.75V9.25H16.25C16.6642 9.25 17 9.58579 17 10C17 10.3882 16.7051 10.7075 16.3271 10.7461L16.25 10.75H10.75V16.25C10.75 16.6642 10.4142 17 10 17C9.58579 17 9.25 16.6642 9.25 16.25V10.75H3.75C3.33579 10.75 3 10.4142 3 10C3 9.58579 3.33579 9.25 3.75 9.25H9.25V3.75C9.25 3.33579 9.58579 3 10 3Z"/>
                        </svg>
                    </div>
                    <span>New chat</span>
                </a>
                <a href="https://claude.ai/chats" target="_blank" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8.99962 2C12.3133 2 14.9996 4.68629 14.9996 8C14.9996 11.3137 12.3133 14 8.99962 14H2.49962C2.30105 13.9998 2.12113 13.8821 2.04161 13.7002C1.96224 13.5181 1.99835 13.3058 2.1334 13.1602L3.93516 11.2178C3.34317 10.2878 2.99962 9.18343 2.99962 8C2.99962 4.68643 5.68609 2.00022 8.99962 2ZM8.99962 3C6.23838 3.00022 3.99961 5.23871 3.99961 8C3.99961 9.11212 4.36265 10.1386 4.97618 10.9688C5.11884 11.1621 5.1035 11.4293 4.94004 11.6055L3.64512 13H8.99962C11.761 13 13.9996 10.7614 13.9996 8C13.9996 5.23858 11.761 3 8.99962 3Z"/>
                    </svg>
                    <span>Chats</span>
                </a>
                <a href="#" class="nav-item active" id="foldersLink">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                        <path d="M2 3h6l2 2h6v10H2V3z"/>
                    </svg>
                    <span>Folders</span>
                </a>
                <a href="#" class="nav-item" id="analyticsLink">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                        <circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M9 9L9 3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M9 9L14 12" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Analytics</span>
                </a>
            </nav>

            <div class="sidebar-section">
                <div class="section-label">Recents</div>
                <div id="recentChats" class="recent-list"></div>
            </div>

            <div id="userProfile" class="user-profile">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <div class="user-name" id="userName">User</div>
                    <div class="user-team" id="userTeam"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Folder List View -->
            <div id="folderListView" class="content-view">
                <header class="page-header">
                    <h1 class="page-title">Folders</h1>
                </header>

                <div class="search-controls">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search folders..." class="search-input">
                    </div>
                </div>

                <div class="filters-bar">
                    <div class="filter-pills" id="filterPills"></div>
                    <div class="sort-controls">
                        <span class="sort-label">Sort by</span>
                        <select id="sortSelect" class="sort-select">
                            <option value="activity">Activity</option>
                            <option value="name">Name</option>
                            <option value="created">Created</option>
                        </select>
                    </div>
                </div>

                <div id="folderGrid" class="folder-grid"></div>
            </div>

            <!-- Folder Detail View -->
            <div id="folderDetailView" class="content-view hidden">
                <div class="detail-header">
                    <button id="backBtn" class="back-btn">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </svg>
                        All folders
                    </button>
                </div>

                <div class="project-header">
                    <div class="project-title-row">
                        <h1 id="folderDetailTitle" class="project-title"></h1>
                    </div>
                    <div class="project-meta">
                        <span class="meta-item" id="folderCategory"></span>
                    </div>
                </div>

                <div class="detail-search-controls">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <input type="text" id="chatSearchInput" placeholder="Search chats in this folder..." class="search-input">
                    </div>
                </div>

                <div class="tabs-container">
                    <div class="tabs">
                        <button class="tab active" data-tab="chats">Chats</button>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="list" title="List view">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <rect y="2" width="16" height="2" rx="1"/>
                                <rect y="7" width="16" height="2" rx="1"/>
                                <rect y="12" width="16" height="2" rx="1"/>
                            </svg>
                        </button>
                        <button class="view-btn" data-view="card" title="Card view">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <rect width="7" height="7" rx="1"/>
                                <rect x="9" width="7" height="7" rx="1"/>
                                <rect y="9" width="7" height="7" rx="1"/>
                                <rect x="9" y="9" width="7" height="7" rx="1"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="chatListContainer" class="chat-list-container list-view"></div>
            </div>

            <!-- Analytics View -->
            <div id="analyticsView" class="content-view hidden">
                <header class="page-header">
                    <h1 class="page-title">Analytics</h1>
                </header>
                <div class="analytics-content">
                    <div class="analytics-chart-container">
                        <canvas id="mainDonutChart" width="300" height="300"></canvas>
                    </div>
                    <div id="mainAnalyticsLegend" class="main-analytics-legend"></div>
                    <div id="mainAnalyticsStats" class="main-analytics-stats"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
