<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Folders: Data Folder Access</title>
  <link rel="stylesheet" href="../lib/color-variants.css">
  <link rel="stylesheet" href="access.css">
</head>
<body>
  <main class="access">
    <h1 class="access-title">Data Folder Access</h1>
    <p class="access-step" id="accessStep" hidden></p>
    <p class="access-status" id="accessStatus">Checking the data folder...</p>
    <p class="access-queue" id="accessQueue" hidden></p>
    <div class="access-actions">
      <button class="access-btn" id="accessGrantBtn" hidden>Allow access</button>
      <button class="access-btn access-btn-light" id="accessChooseBtn" hidden>Choose folder</button>
      <button class="access-btn" id="accessFlagBtn" hidden>Open flag</button>
    </div>
    <p class="access-result" id="accessResult" hidden></p>
    <p class="access-note">Exports are saved while this window is open with access granted, and after it closes once access is allowed on every visit.</p>
    <ul class="access-log" id="accessLog" hidden></ul>
  </main>
  <script src="../lib/build-reload.js"></script>
  <script src="../lib/apply-update.js"></script>
  <script src="../lib/chat-markdown.js"></script>
  <script src="../lib/cowork-api.js"></script>
  <script src="../lib/cowork-markdown.js"></script>
  <script src="../lib/cowork-export.js"></script>
  <script src="../lib/storage-keys.js"></script>
  <script src="../lib/color-variants.js"></script>
  <script src="../lib/button-color.js"></script>
  <script src="../lib/handle-storage.js"></script>
  <script src="../lib/data-file.js"></script>
  <script src="../lib/export-files.js"></script>
  <script src="../lib/export-state.js"></script>
  <script src="../lib/folder-access.js"></script>
  <script src="../lib/folder-picker.js"></script>
  <script src="../lib/account-file-list.js"></script>
  <script src="../lib/account-files.js"></script>
  <script src="../lib/search-words.js"></script>
  <script src="../lib/search-store.js"></script>
  <script src="../lib/search-index.js"></script>
  <script src="../lib/search-build.js"></script>
  <script src="../lib/folder-ops.js"></script>
  <script src="access.js"></script>
</body>
</html>
