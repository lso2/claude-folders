<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude - Folders</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-text">Claude</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M16.5 4C17.3284 4 18 4.67157 18 5.5V14.5C18 15.3284 17.3284 16 16.5 16H3.5C2.67157 16 2 15.3284 2 14.5V5.5C2 4.67157 2.67157 4 3.5 4H16.5ZM7 15H16.5C16.7761 15 17 14.7761 17 14.5V5.5C17 5.22386 16.7761 5 16.5 5H7V15ZM3.5 5C3.22386 5 3 5.22386 3 5.5V14.5C3 14.7761 3.22386 15 3.5 15H6V5H3.5Z"></path>
                    </svg>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="https://claude.ai/new" target="_blank" class="nav-item new-chat-btn">
                    <div class="new-chat-icon-wrapper">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 3C10.4142 3 10.75 3.33579 10.75 3.75V9.25H16.25C16.6642 9.25 17 9.58579 17 10C17 10.3882 16.7051 10.7075 16.3271 10.7461L16.25 10.75H10.75V16.25C10.75 16.6642 10.4142 17 10 17C9.58579 17 9.25 16.6642 9.25 16.25V10.75H3.75C3.33579 10.75 3 10.4142 3 10C3 9.58579 3.33579 9.25 3.75 9.25H9.25V3.75C9.25 3.33579 9.58579 3 10 3Z"/>
                        </svg>
                    </div>
                    <span>New chat</span>
                </a>
                <a href="https://claude.ai/chats" target="_blank" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8.99962 2C12.3133 2 14.9996 4.68629 14.9996 8C14.9996 11.3137 12.3133 14 8.99962 14H2.49962C2.30105 13.9998 2.12113 13.8821 2.04161 13.7002C1.96224 13.5181 1.99835 13.3058 2.1334 13.1602L3.93516 11.2178C3.34317 10.2878 2.99962 9.18343 2.99962 8C2.99962 4.68643 5.68609 2.00022 8.99962 2ZM8.99962 3C6.23838 3.00022 3.99961 5.23871 3.99961 8C3.99961 9.11212 4.36265 10.1386 4.97618 10.9688C5.11884 11.1621 5.1035 11.4293 4.94004 11.6055L3.64512 13H8.99962C11.761 13 13.9996 10.7614 13.9996 8C13.9996 5.23858 11.761 3 8.99962 3Z"/>
                        <path d="M16.5445 9.72754C16.4182 9.53266 16.1678 9.44648 15.943 9.53418C15.7183 9.62215 15.5932 9.85502 15.6324 10.084L15.7369 10.3955C15.9073 10.8986 16.0006 11.438 16.0006 12C16.0006 13.1123 15.6376 14.1386 15.024 14.9687C14.8811 15.1621 14.8956 15.4302 15.0592 15.6064L16.3531 17H11.0006C9.54519 17 8.23527 16.3782 7.32091 15.3848L7.07091 15.1103C6.88996 14.9645 6.62535 14.9606 6.43907 15.1143C6.25267 15.2682 6.20668 15.529 6.31603 15.7344L6.58458 16.0625C7.68048 17.253 9.25377 18 11.0006 18H17.5006C17.6991 17.9998 17.8791 17.8822 17.9586 17.7002C18.038 17.5181 18.0018 17.3058 17.8668 17.1602L16.0631 15.2178C16.6554 14.2876 17.0006 13.1837 17.0006 12C17.0006 11.3271 16.8891 10.6792 16.6842 10.0742L16.5445 9.72754Z"/>
                    </svg>
                    <span>Chats</span>
                </a>
                <a href="https://claude.ai/projects" target="_blank" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M15.8198 7C16.6885 7.00025 17.3624 7.73158 17.3178 8.57617L17.2993 8.74707L16.1332 15.7471C16.0126 16.4699 15.3865 16.9996 14.6538 17H5.34711C4.6142 16.9998 3.98833 16.47 3.86762 15.7471L2.7016 8.74707C2.54922 7.83277 3.25418 7 4.18109 7H15.8198ZM4.18109 8C3.87216 8 3.63722 8.27731 3.68793 8.58203L4.85394 15.582C4.89413 15.8229 5.10291 15.9998 5.34711 16H14.6538C14.8978 15.9996 15.1068 15.8228 15.1469 15.582L16.3129 8.58203L16.3188 8.46973C16.3036 8.21259 16.0899 8.00023 15.8198 8H4.18109Z"/>
                        <path d="M16.0004 5.5C16.0004 5.224 15.7764 5.00024 15.5004 5H4.50043C4.22428 5 4.00043 5.22386 4.00043 5.5C4.00043 5.77614 4.22428 6 4.50043 6H15.5004C15.7764 5.99976 16.0004 5.776 16.0004 5.5Z"/>
                        <path d="M14.5004 3.5C14.5004 3.224 14.2764 3.00024 14.0004 3H6.00043C5.72428 3 5.50043 3.22386 5.50043 3.5C5.50043 3.77614 5.72428 4 6.00043 4H14.0004C14.2764 3.99976 14.5004 3.776 14.5004 3.5Z"/>
                    </svg>
                    <span>Projects</span>
                </a>
                <a href="#" class="nav-item active" id="foldersLink">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                        <path d="M2 3h6l2 2h6v10H2V3z"/>
                    </svg>
                    <span>Folders</span>
                </a>
            </nav>

            <div class="sidebar-section">
                <div class="section-label">Recents</div>
                <div id="recentChats" class="recent-list"></div>
            </div>

            <div id="userProfile" class="user-profile">
                <div class="user-avatar" id="userAvatar">J</div>
                <div class="user-info">
                    <div class="user-name" id="userName">James</div>
                    <div class="user-team" id="userTeam"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Folder List View -->
            <div id="folderListView" class="content-view">
                <header class="page-header">
                    <h1 class="page-title">Folders</h1>
                    <div class="header-actions">
                        <button class="btn-secondary btn-analytics" id="analyticsBtn" title="View analytics">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 8L8 3" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 8L12 10" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            Analytics
                        </button>
                        <button class="btn-secondary btn-export-md" id="exportMdBtn" title="Export all chats to Markdown files">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Export MD
                        </button>
                        <button class="btn-secondary" id="exportBtn" title="Export data for Claude to organize">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M8 2v8M4 6l4-4 4 4M2 14h12"/>
                            </svg>
                            Export
                        </button>
                        <button class="btn-secondary" id="importBtn" title="Import organized data from Claude">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M8 10V2M4 6l4 4 4-4M2 14h12"/>
                            </svg>
                            Import
                        </button>
                        <button class="btn-secondary btn-danger" id="clearBtn" title="Clear all data">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M2 4h12M5 4V3a1 1 0 011-1h4a1 1 0 011 1v1M6 7v5M10 7v5M3 4l1 10a1 1 0 001 1h6a1 1 0 001-1l1-10"/>
                            </svg>
                            Clear
                        </button>
                        <button class="btn-new-project" id="newFolderBtn">
                            <span class="plus-icon">+</span>
                            New folder
                        </button>
                    </div>
                </header>

                <div class="search-controls">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search folders..." class="search-input">
                    </div>
                </div>

                <div class="filters-bar">
                    <div class="filter-pills" id="filterPills"></div>
                    <div class="filter-search">
                        <input type="text" id="categorySearchInput" placeholder="Filter categories..." class="category-search-input">
                    </div>
                    <div class="sort-controls">
                        <span class="sort-label">Sort by</span>
                        <select id="sortSelect" class="sort-select">
                            <option value="activity">Activity</option>
                            <option value="name">Name</option>
                            <option value="created">Created</option>
                        </select>
                    </div>
                </div>

                <div id="folderGrid" class="folder-grid"></div>
            </div>

            <!-- Analytics View -->
            <div id="analyticsView" class="content-view hidden">
                <header class="page-header">
                    <button class="back-btn" id="analyticsBackBtn">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </svg>
                        Back to Folders
                    </button>
                    <h1 class="page-title">Analytics</h1>
                </header>
                
                <div class="analytics-container">
                    <div class="analytics-chart-section">
                        <h2 class="analytics-section-title">Category Distribution</h2>
                        <div class="analytics-chart-wrapper">
                            <canvas id="analyticsDonutChart" width="300" height="300"></canvas>
                            <div id="analyticsChartCenter" class="chart-center-label"></div>
                        </div>
                        <div id="analyticsLegend" class="analytics-legend"></div>
                    </div>
                    
                    <div class="analytics-stats-section">
                        <h2 class="analytics-section-title">Overview</h2>
                        <div id="analyticsStats" class="analytics-stats-grid"></div>
                    </div>
                    
                    <div class="analytics-breakdown-section">
                        <h2 class="analytics-section-title">Folders by Category</h2>
                        <div id="analyticsFolderBreakdown" class="analytics-breakdown"></div>
                    </div>
                </div>
            </div>

            <!-- Folder Detail View -->
            <div id="folderDetailView" class="content-view hidden">
                <div id="folderDetailHeader" class="folder-detail-header">
                    <!-- Header content rendered dynamically by JS -->
                </div>

                <div class="tabs-container">
                    <div class="tabs">
                        <button class="tab active" data-tab="chats">Your chats</button>
                        <button class="tab" data-tab="activity">Activity</button>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="list" title="List view">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <rect y="2" width="16" height="2" rx="1"/>
                                <rect y="7" width="16" height="2" rx="1"/>
                                <rect y="12" width="16" height="2" rx="1"/>
                            </svg>
                        </button>
                        <button class="view-btn" data-view="card" title="Card view">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <rect width="7" height="7" rx="1"/>
                                <rect x="9" width="7" height="7" rx="1"/>
                                <rect y="9" width="7" height="7" rx="1"/>
                                <rect x="9" y="9" width="7" height="7" rx="1"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="chatListContainer" class="chat-list-container list-view"></div>

                <div class="activity-notice">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
                        <path d="M6 1a5 5 0 100 10A5 5 0 006 1z"/>
                    </svg>
                    Your chats are private until shared
                </div>
            </div>
        </main>
    </div>

    <footer class="app-footer">
        <span class="footer-name">Claude Folders v1.0.42</span>
        <span class="footer-sep">•</span>
        <a href="https://github.com/lso1/claude-folders" target="_blank" class="footer-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            GitHub
        </a>
        <span class="footer-sep">•</span>
        <a href="https://ko-fi.com/techreader" target="_blank" class="footer-link footer-coffee">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 3H4v10a4 4 0 004 4h6a4 4 0 004-4v-3h2a3 3 0 000-6zm0 4h-2V5h2a1 1 0 010 2zM2 21h20v2H2z"/>
            </svg>
            Buy me a coffee
        </a>
    </footer>

    <script src="../lib/handle-storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
