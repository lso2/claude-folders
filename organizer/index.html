<!DOCTYPE html>
<html lang="en" data-cf-color-scope="organizer">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude - Folders</title>
    <link rel="stylesheet" href="../lib/color-variants.css">
    <link rel="stylesheet" href="../lib/select-picker.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../lib/page-frame.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="content-search.css">
    <link rel="stylesheet" href="chat-lists.css">
</head>
<body>
    <div class="app-layout" id="appLayout">
        <!-- Claude's sidebar as last read on claude.ai (organizer/sidebar.js) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo-text" id="brandName"></span>
                <button class="sidebar-toggle" id="sidebarToggle" title="Collapse sidebar" aria-label="Collapse sidebar">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M16.5 4C17.3284 4 18 4.67157 18 5.5V14.5C18 15.3284 17.3284 16 16.5 16H3.5C2.67157 16 2 15.3284 2 14.5V5.5C2 4.67157 2.67157 4 3.5 4H16.5ZM7 15H16.5C16.7761 15 17 14.7761 17 14.5V5.5C17 5.22386 16.7761 5 16.5 5H7V15ZM3.5 5C3.22386 5 3 5.22386 3 5.5V14.5C3 14.7761 3.22386 15 3.5 15H6V5H3.5Z"></path>
                    </svg>
                </button>
            </div>

            <!-- The rows, the sections and the chats scroll together; the header and the account button stay -->
            <div class="sidebar-scroll" id="sidebarScroll">
                <nav class="sidebar-nav" id="sidebarNav" aria-label="Claude"></nav>
                <div class="sidebar-lists">
                    <div id="sidebarSections"></div>
                    <div class="sidebar-section">
                        <div class="section-label" id="recentsLabel" hidden></div>
                        <div id="recentChats" class="recent-list"></div>
                    </div>
                </div>
            </div>

            <div class="account-area" id="accountArea">
                <div class="account-menu" id="accountMenu" role="menu" hidden></div>
                <button class="user-profile" id="userProfile" aria-haspopup="menu" aria-expanded="false">
                    <span class="user-avatar" id="userAvatar"></span>
                    <span class="user-info">
                        <span class="user-name" id="userName"></span>
                        <span class="user-team" id="userTeam"></span>
                    </span>
                    <svg class="user-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M4 10l4-4 4 4"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
        </aside>

        <div class="main-column">
            <!-- Main Content -->
            <main class="main-content" id="mainContent">
                <!-- The sync or folder export running in the claude.ai tab (organizer/run-pane.js) -->
                <div id="runPane" class="run-pane" role="status" aria-live="polite" hidden>
                    <div class="run-pane-head">
                        <span id="runPaneTitle" class="run-pane-title"></span>
                        <button id="runPaneClose" class="run-pane-close" aria-label="Close">×</button>
                    </div>
                    <div id="runPaneText" class="run-pane-text"></div>
                    <ul id="runPaneLines" class="run-pane-lines"></ul>
                </div>
                <!-- The notice for a newer version on GitHub (lib/update-notice.js) -->
                <div class="cf-update-slot"></div>
                <!-- The top bar, shown above the folder list, a folder and the analytics -->
                <div class="top-bar" id="topBar">
                    <header class="page-header">
                        <h1 class="page-title"><button type="button" class="page-title-link" id="topBarFolders" title="Show all folders">Folders</button></h1>
                        <div class="header-actions">
                            <button class="btn-secondary" id="analyticsBtn" aria-pressed="false" title="Chats per category. Clicking it again on the analytics page returns to the folders">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                                    <path d="M8 8L8 3" stroke="currentColor" stroke-width="1.5"/>
                                    <path d="M8 8L12 10" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                                Analytics
                            </button>
                            <button class="btn-secondary" id="syncBtn" title="Read every chat and Cowork session of this login, export the ones missing in the data folder and update the outdated exports">
                                <svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M142.9 142.9c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5c0 0 0 0 0 0H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1C73.2 122 55.6 150.7 44.8 181.4c-5.9 16.7 2.9 34.9 19.5 40.8s34.9-2.9 40.8-19.5c7.7-21.8 20.2-42.3 37.8-59.8zM16 312v7.6 .7V440c0 9.7 5.8 18.5 14.8 22.2s19.3 1.7 26.2-5.2l41.6-41.6c87.6 86.5 228.7 86.2 315.8-1c24.4-24.4 42.1-53.1 52.9-83.7c5.9-16.7-2.9-34.9-19.5-40.8s-34.9 2.9-40.8 19.5c-7.7 21.8-20.2 42.3-37.8 59.8c-62.2 62.2-162.7 62.5-225.3 1L185 329c6.9-6.9 8.9-17.2 5.2-26.2s-12.5-14.8-22.2-14.8H48.4h-.7H40c-13.3 0-24 10.7-24 24z"/></svg>
                                Sync
                            </button>
                            <!-- Bolt: Font Awesome Free 6.5.2 (https://fontawesome.com/license/free, CC BY 4.0) -->
                            <button class="btn-secondary" id="organizeBtn" title="Organize in one click: the chat titles are sent to Claude in a new claude.ai tab, and Claude's answer is shown in a preview to apply">
                                <svg width="12" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path d="M349.4 44.6c5.9-13.7 1.5-29.7-10.6-38.5s-28.6-8-39.9 1.8l-256 224c-10 8.8-13.6 22.9-8.9 35.3S50.7 288 64 288H175.5L98.6 467.4c-5.9 13.7-1.5 29.7 10.6 38.5s28.6 8 39.9-1.8l256-224c10-8.8 13.6-22.9 8.9-35.3s-16.6-20.7-30-20.7H272.5L349.4 44.6z"/></svg>
                                Organize
                            </button>
                            <button class="btn-secondary" id="exportBtn" title="Copy the chat list for Claude to organize">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M8 2v8M4 6l4-4 4 4M2 14h12"/>
                                </svg>
                                Export
                            </button>
                            <button class="btn-secondary" id="importBtn" title="Import folders Claude organized">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M8 10V2M4 6l4 4 4-4M2 14h12"/>
                                </svg>
                                Import
                            </button>
                            <button class="btn-secondary" id="settingsBtn" title="Claude Folders settings">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                                </svg>
                                Settings
                            </button>
                            <button class="btn-new-project" id="newFolderBtn">
                                <span class="plus-icon">+</span>
                                New folder
                            </button>
                        </div>
                    </header>
                </div>
                <!-- The search bar and its Chats list, above the home and a folder (organizer/content-search.js) -->
                <div id="searchArea" class="search-area">
                    <div class="search-controls">
                        <select id="accountSelect" class="account-select cf-select" aria-label="Accounts shown" hidden></select>
                        <button class="btn-secondary" id="importAccountBtn" title="Open the import dialog in a new claude.ai tab" hidden>Import from another account</button>
                        <div class="search-box">
                            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="text" id="searchInput" placeholder="Search folders and chats..." class="search-input">
                        </div>
                    </div>

                    <!-- Chats whose title or exported text has the search box's words (organizer/content-search.js) -->
                    <section id="contentSearch" class="content-search" hidden>
                        <div class="content-search-head">
                            <h2 class="content-search-title">Chats</h2>
                            <span id="contentSearchStatus" class="content-search-status" role="status" aria-live="polite"></span>
                            <button id="contentSearchAccess" class="btn-secondary content-search-access" hidden>Open folder access</button>
                            <!-- Which matches are listed, and the caret that collapses the list -->
                            <div class="content-search-tools">
                                <div class="content-search-modes" role="group" aria-label="Chats listed">
                                    <button type="button" class="content-search-mode active" data-mode="all" aria-pressed="true" title="Chats matched by title or by exported text">All</button>
                                    <button type="button" class="content-search-mode" data-mode="title" aria-pressed="false" title="Chats matched by title">Titles</button>
                                    <button type="button" class="content-search-mode" data-mode="content" aria-pressed="false" title="Chats matched by exported text">Content</button>
                                </div>
                                <!-- The order of the chats listed (organizer/content-sort.js) -->
                                <label class="content-search-sort">
                                    <span class="content-search-sort-label">Sort by</span>
                                    <select id="contentSearchSort" class="content-search-sort-select cf-select">
                                        <option value="match">Best match</option>
                                        <option value="name">Name</option>
                                        <option value="recent">Most recent message</option>
                                        <option value="oldest">Oldest message</option>
                                        <option value="exported">Export date</option>
                                    </select>
                                </label>
                                <!-- Arrow up: Font Awesome Free 6.5.2 (https://fontawesome.com/license/free, CC BY 4.0) -->
                                <button type="button" id="contentSearchSortDir" class="content-search-sort-dir" disabled>
                                    <svg width="10" height="12" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"/></svg>
                                    <span id="contentSearchSortDirText">Desc</span>
                                </button>
                                <!-- Chevron down: Font Awesome Free 6.5.2 (https://fontawesome.com/license/free, CC BY 4.0) -->
                                <button type="button" id="contentSearchCollapse" class="content-search-collapse" aria-expanded="true" aria-controls="contentSearchBody" title="Collapse the chat list" aria-label="Collapse the chat list">
                                    <svg width="12" height="12" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"/></svg>
                                </button>
                            </div>
                        </div>
                        <!-- Shown while the exports are read for search (organizer/content-search.js setContentSearchProgress) -->
                        <div id="contentSearchProgress" class="content-search-progress indeterminate" role="progressbar" aria-label="Searching the chat exports" aria-valuemin="0" hidden><div class="content-search-progress-fill"></div></div>
                        <div id="contentSearchBody" class="content-search-body">
                            <ul id="contentSearchList" class="content-search-list"></ul>
                            <button id="contentSearchMore" class="btn-secondary content-search-more" hidden></button>
                        </div>
                    </section>
                </div>

                <!-- Folder List View -->
                <div id="folderListView" class="content-view">
                    <!-- The Categories, Cards and List buttons with the category filter at their right. At the far right, the folder
                         sort of Categories, or the chat count and sort of Cards and List (organizer/home-views.js) -->
                    <div class="home-view-bar">
                        <div class="content-search-modes home-view-modes" role="group" aria-label="View">
                            <button type="button" class="content-search-mode home-view-btn active" data-home-view="categories" aria-pressed="true" title="The folders by category">Categories</button>
                            <button type="button" class="content-search-mode home-view-btn" data-home-view="cards" aria-pressed="false" title="Every chat of the folders shown, as cards">Cards</button>
                            <button type="button" class="content-search-mode home-view-btn" data-home-view="list" aria-pressed="false" title="Every chat of the folders shown, as rows">List</button>
                        </div>
                        <div class="filter-search" id="categoryFilterSearch">
                            <input type="text" id="categorySearchInput" placeholder="Filter categories..." class="category-search-input">
                        </div>
                        <div class="sort-controls" id="categorySortControls">
                            <span class="sort-label">Sort by</span>
                            <select id="sortSelect" class="sort-select cf-select">
                                <option value="activity">Activity</option>
                                <option value="name">Name</option>
                                <option value="created">Created</option>
                            </select>
                        </div>
                        <div class="home-chat-tools" id="homeChatTools">
                            <span class="home-chat-count" id="homeChatCount"></span>
                            <label class="content-search-sort chat-sort">
                                <span class="content-search-sort-label">Sort by</span>
                                <select class="content-search-sort-select chat-sort-select cf-select" aria-label="Sort the chats by">
                                    <option value="name">Name</option>
                                    <option value="recent">Most recent message</option>
                                    <option value="oldest">Oldest message</option>
                                    <option value="exported">Export date</option>
                                </select>
                            </label>
                            <!-- Arrow up: Font Awesome Free 6.5.2 (https://fontawesome.com/license/free, CC BY 4.0) -->
                            <button type="button" class="content-search-sort-dir chat-sort-dir">
                                <svg width="10" height="12" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"/></svg>
                                <span class="chat-sort-dir-text">Desc</span>
                            </button>
                        </div>
                    </div>


                    <!-- Categories on their own row -->
                    <div class="filter-pills" id="filterPills"></div>

                    <div id="folderGrid" class="folder-grid"></div>
                    <div id="homeChatList" class="chat-list-container list-view" hidden></div>
                    <button type="button" id="homeChatMore" class="btn-secondary home-chat-more" hidden></button>
                </div>

                <!-- Analytics View -->
                <div id="analyticsView" class="content-view hidden">
                    <header class="page-header">
                        <button class="back-btn" id="analyticsBackBtn">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M10 2L4 8l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                            </svg>
                            Back to Folders
                        </button>
                        <h1 class="page-title">Analytics</h1>
                    </header>
                
                    <div class="analytics-container">
                        <div class="analytics-chart-section">
                            <h2 class="analytics-section-title">Category Distribution</h2>
                            <div class="analytics-chart-wrapper">
                                <canvas id="analyticsDonutChart" width="300" height="300"></canvas>
                                <div id="analyticsChartCenter" class="chart-center-label"></div>
                            </div>
                            <div id="analyticsLegend" class="analytics-legend"></div>
                        </div>
                    
                        <div class="analytics-stats-section">
                            <h2 class="analytics-section-title">Overview</h2>
                            <div id="analyticsStats" class="analytics-stats-grid"></div>
                        </div>
                    
                        <div class="analytics-breakdown-section">
                            <h2 class="analytics-section-title">Folders by Category</h2>
                            <div id="analyticsFolderBreakdown" class="analytics-breakdown"></div>
                        </div>
                    </div>
                </div>

                <!-- Folder Detail View -->
                <div id="folderDetailView" class="content-view hidden">
                    <div id="folderDetailHeader" class="folder-detail-header">
                        <!-- Header content rendered dynamically by JS -->
                    </div>

                    <div class="tabs-container">
                        <div class="tabs">
                            <button class="tab active" data-tab="chats">Your chats</button>
                            <button class="tab" data-tab="activity">Activity</button>
                        </div>
                        <div class="folder-chat-tools">
                        <label class="content-search-sort chat-sort">
                            <span class="content-search-sort-label">Sort by</span>
                            <select class="content-search-sort-select chat-sort-select cf-select" aria-label="Sort the chats by">
                                <option value="name">Name</option>
                                <option value="recent">Most recent message</option>
                                <option value="oldest">Oldest message</option>
                                <option value="exported">Export date</option>
                            </select>
                        </label>
                        <!-- Arrow up: Font Awesome Free 6.5.2 (https://fontawesome.com/license/free, CC BY 4.0) -->
                        <button type="button" class="content-search-sort-dir chat-sort-dir">
                            <svg width="10" height="12" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"/></svg>
                            <span class="chat-sort-dir-text">Desc</span>
                        </button>
                        </div>
                        <div class="view-toggle">
                            <button class="view-btn active" data-view="list" title="List view">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <rect y="2" width="16" height="2" rx="1"/>
                                    <rect y="7" width="16" height="2" rx="1"/>
                                    <rect y="12" width="16" height="2" rx="1"/>
                                </svg>
                            </button>
                            <button class="view-btn" data-view="card" title="Card view">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <rect width="7" height="7" rx="1"/>
                                    <rect x="9" width="7" height="7" rx="1"/>
                                    <rect y="9" width="7" height="7" rx="1"/>
                                    <rect x="9" y="9" width="7" height="7" rx="1"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div id="chatListContainer" class="chat-list-container list-view"></div>

                    <div class="activity-notice">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
                            <path d="M6 1a5 5 0 100 10A5 5 0 006 1z"/>
                        </svg>
                        Your chats are private until shared
                    </div>
                </div>
            </main>

            <footer class="app-footer">
                <span class="footer-name"></span>
                <span class="footer-sep">•</span>
                <a href="https://github.com/lso2/claude-folders" target="_blank" class="footer-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    GitHub
                </a>
                <span class="footer-sep">•</span>
                <a href="https://plexpixel.com/donate" target="_blank" rel="noopener" class="footer-link footer-coffee">
                    <svg width="15" height="15" viewBox="0 0 640 512" fill="currentColor" aria-hidden="true"><path d="M96 64c0-17.7 14.3-32 32-32H448h64c70.7 0 128 57.3 128 128s-57.3 128-128 128H480c0 53-43 96-96 96H192c-53 0-96-43-96-96V64zM480 224h32c35.3 0 64-28.7 64-64s-28.7-64-64-64H480V224zM32 416H544c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/></svg>
                    Donate
                </a>
                <span class="footer-sep">•</span>
                <button type="button" class="footer-link cf-update-check" id="organizerUpdateCheck">Check for updates</button>
            </footer>
        </div>
    </div>

    <script src="../lib/build-reload.js"></script>
    <script src="../lib/apply-update.js"></script>
    <script src="../lib/storage-keys.js"></script>
    <script src="../lib/color-variants.js"></script>
    <script src="../lib/select-size.js"></script>
    <script src="../lib/button-color.js"></script>
    <script src="../lib/update-notice.js"></script>
    <script src="../lib/chat-markdown.js"></script>
